name: channel-patrol
description: "総控巡検 — 读 memory 了解全局 + 检查各 channel + TODO 管理"
start: read_memory

nodes:
  read_memory:
    task: |
      读 memory/当天日期.md，提取今天各 cron 的执行记录。
      按 channel 分组汇总：
      - 哪些 channel 有产出？产出了什么？
      - 哪些 channel 该跑但没跑？（对照 channels/ 目录的 cron 配置）
      - 有没有报错或异常？
      输出：一份按 channel 分组的状态清单（每个 channel 1-2 行）。
    branches:
      - condition: "完成"
        next: check_channels

  check_channels:
    task: |
      用 Discord API 检查各 channel 最近 1 小时的消息。
      对比上一步的 memory 记录，补充 memory 里没有的信息：
      - 有没有 Luna 的新消息需要关注？
      - 有没有卡住的 thread？
      - 有没有 cron 执行了但没写 memory 的？
      环境：proxy export https_proxy=http://127.0.0.1:1083
      只检查有 cron 的 channel，不检查 #general 等非工作 channel。
    branches:
      - condition: "完成"
        next: celebrate_check

  celebrate_check:
    task: |
      🔔 **Celebrate 检测（08-21 落地，celebrate 盲区第 6 天）**
      merge/完成信号 → 必须发庆祝 meme，不再只发 facepalm/thinking。

      1. 检测近 24h 完成信号：
      ```
      export https_proxy=http://127.0.0.1:1083
      # ① PR merged by kagura-agent 近 24h
      gh search prs --author kagura-agent --state merged --merged:>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ) --json number,title,repositoryUrl --jq '.[] | "\(.repositoryUrl) #\(.number) \(.title)"' 2>&1
      # ② 当天 memory 里的完成/合并信号
      grep -iE "merged|✅|完成|闭环" memory/$(date +%Y-%m-%d).md 2>/dev/null | head -5
      # ③ cove/channel 任务完成信号（如有记录）
      ```

      2. 判定与动作：
      - **有任何信号** → 必须 `memes send happy "🎉 <信号摘要>"`（happy 近 3 次已用过则换 celebrate/rocket/wow，看 meme-tracker.json history）。发送目标：信号对应 channel（PR → 该 repo 的 channel），无明确归属 → 当前巡检 channel。发送后把「已庆祝」写进 memory。
      - **无信号** → 一行说明 "无 celebrate 信号"，跳过。

      3. 把 celebrate 结果写进 report 的「需关注」区（发了什么/为什么）。
    branches:
      - condition: "完成"
        next: manage_todo

  manage_todo:
    task: |
      读 pulse-todo SKILL.md，按其规则管理 TODO.md：
      - **只删确认已完成的**（有 memory 记录证明做完了）
      - 超 3 天没动的 → 标记提醒，不要直接删
      - 依赖 Luna 的 → 标记出来
      - 不对齐北极星的 → 建议删（不直接删）
      ⚠️ 不确定是否完成的 → 不删。误删比留僵尸更糟。
      （pin 更新由 hook 自动处理，不需要手动 PATCH）
    branches:
      - condition: "完成"
        next: report

  report:
    task: |
      生成简洁汇总发到当前 channel：
      格式：
      ```
      📊 巡检 HH:00

      **有动态的 channel：**
      - #work: [一句话]
      - #study: [一句话]
      ...

      **需关注：**
      - [问题或待办]

      **TODO 变更：**
      - [删了什么/加了什么]
      ```

      如果一切正常、无新动态、TODO 无变化 → NO_REPLY

      最后往 memory/当天日期.md 追加巡检记录。
    terminal: true
